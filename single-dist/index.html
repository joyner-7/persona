sion:2,emotional_neglect:1}}}},{id:3,text:`周末没有安排时，你更可能的状态是？`,options:{A:{text:`安心放松，做点喜欢的事，觉得这是属于自己的时间。`,archetype:`A`,dimension_scores:{emotional_warmth:2,security_base:2,boundary_intrusion:0}},B:{text:`总觉得应该做点什么有意义的事，闲着会让我有些不安。`,archetype:`B`,dimension_scores:{control_intensity:1,emotional_neglect:1}},C:{text:`有点焦虑，觉得别人都在进步，自己躺平就会落后。`,archetype:`C`,dimension_scores:{emotional_neglect:2,emotional_warmth:1}},D:{text:`习惯独处，但也说不上享受，就是不知道能约谁、找谁。`,archetype:`D`,dimension_scores:{emotional_neglect:2,security_base:1}}}},{id:4,text:`需要做一个重要决定时，你通常怎么选？`,options:{A:{text:`会听听身边人的建议，但最终相信自己的判断。`,archetype:`A`,dimension_scores:{emotional_warmth:2,security_base:1}},B:{text:`反复权衡利弊，选那个最稳妥、最不容易出错的。`,archetype:`B`,dimension_scores:{control_intensity:2,security_base:1}},C:{text:`选那个看起来最拿得出手、说出来不会让人失望的。`,archetype:`C`,dimension_scores:{conditional_love:2,control_intensity:1}},D:{text:`拖到最后不得不选，或者干脆让别人帮我拿主意。`,archetype:`D`,dimension_scores:{emotional_neglect:2,boundary_intrusion:1}}}},{id:5,text:`你取得了一个不错的成绩，你第一个想告诉谁？`,options:{A:{text:`会自然地分享给亲近的人，知道他们会真心为我高兴。`,archetype:`A`,dimension_scores:{emotional_warmth:3,conditional_love:0}},B:{text:`会告诉家人或领导，觉得有义务汇报一下，证明自己没让人失望。`,archetype:`B`,dimension_scores:{conditional_love:1,control_intensity:1}},C:{text:`看情况吧，不太确定对方是真的想听，还是只是礼貌回应。`,archetype:`C`,dimension_scores:{conditional_love:3,emotional_warmth:1}},D:{text:`想了想还是算了，好像说出去也没什么意义，自己知道就好。`,archetype:`D`,dimension_scores:{emotional_neglect:2,emotional_warmth:1}}}},{id:6,text:`有人靠你很近说话或翻看你的手机时，你的感觉是？`,options:{A:{text:`没什么特别感觉，信任的人靠近很自然，不太在意这些。`,archetype:`A`,dimension_scores:{boundary_intrusion:0,emotional_warmth:1}},B:{text:`很不舒服，会本能地往后退或把手机收起来，感觉被冒犯。`,archetype:`B`,dimension_scores:{control_intensity:1,boundary_intrusion:2}},C:{text:`表面上保持微笑和配合，但心里会暗暗记下这个不太舒服的瞬间。`,archetype:`C`,dimension_scores:{boundary_intrusion:1,conditional_love:1}},D:{text:`有点困惑，不太确定自己是否有权利说不或者拒绝对方。`,archetype:`D`,dimension_scores:{boundary_intrusion:2,emotional_neglect:1}}}},{id:7,text:`当你感到身心俱疲时，你通常会怎么做？`,options:{A:{text:`主动找信任的人倾诉或寻求帮助，不介意暴露脆弱。`,archetype:`A`,dimension_scores:{emotional_warmth:3,security_base:1,emotional_neglect:0}},B:{text:`自己扛着，等扛过去了再说，不想让人觉得我脆弱或麻烦。`,archetype:`B`,dimension_scores:{emotional_neglect:2,control_intensity:0}},C:{text:`会在别人面前展示一小部分疲惫，确保看起来不那么惨，又不会被说冷漠。`,archetype:`C`,dimension_scores:{conditional_love:2,emotional_warmth:1}},D:{text:`心里希望有人发现我的状态不好，但如果没人注意到，也不会主动开口。`,archetype:`D`,dimension_scores:{emotional_neglect:2,security_base:1}}}},{id:8,text:`和别人发生矛盾后，你通常的反应是？`,options:{A:{text:`吵完了就翻篇，不会记仇，觉得沟通清楚就好。`,archetype:`A`,dimension_scores:{security_base:1,emotional_warmth:2,emotional_neglect:0}},B:{text:`表面假装没事，但内心会冷战，等着对方先低头。`,archetype:`B`,dimension_scores:{emotional_neglect:2,control_intensity:0}},C:{text:`会反思是不是自己的问题，然后主动去修复关系，哪怕不是自己的错。`,archetype:`C`,dimension_scores:{boundary_intrusion:2,control_intensity:1}},D:{text:`直接回避，觉得解释和争吵都没用，不如让时间冲淡一切。`,archetype:`D`,dimension_scores:{emotional_neglect:1,boundary_intrusion:1,security_base:0}}}},{id:9,text:`别人送你一件你并不需要或喜欢的礼物，你会？`,options:{A:{text:`真心感谢对方的心意，但也会坦诚地告诉对方我更喜欢什么。`,archetype:`A`,dimension_scores:{boundary_intrusion:0,emotional_warmth:1,conditional_love:0}},B:{text:`装作很喜欢的样子，内心却因为辜负了别人的心意而自责。`,archetype:`B`,dimension_scores:{conditional_love:1,control_intensity:1}},C:{text:`会想：这个礼物是送给我本人的，还是送给他们心目中那个「应该的我」？`,archetype:`C`,dimension_scores:{conditional_love:2,boundary_intrusion:1}},D:{text:`有点不知所措，不太习惯收到礼物，甚至觉得受之有愧。`,archetype:`D`,dimension_scores:{emotional_neglect:2,conditional_love:1}}}},{id:10,text:`回想你情绪最崩溃的一次，当时的场景是？`,options:{A:{text:`有人陪在我身边，没有说太多话，但让我感觉不是一个人。`,archetype:`A`,dimension_scores:{emotional_warmth:3,emotional_neglect:0}},B:{text:`我被要求「别哭了，哭解决不了问题」，然后情绪被硬生生压了回去。`,archetype:`B`,dimension_scores:{control_intensity:2,emotional_warmth:1}},C:{text:`我躲起来哭，哭完还装作什么都没发生过，不想给别人添麻烦。`,archetype:`C`,dimension_scores:{emotional_neglect:1,security_base:0}},D:{text:`哭了也没人注意到，或者被人说「至于嘛」，从此学会了不再轻易掉眼泪。`,archetype:`D`,dimension_scores:{emotional_neglect:3,emotional_warmth:0}}}},{id:11,text:`你怎么看待求助这件事？`,options:{A:{text:`需要的时候就开口，不觉得丢人，别人需要时我也会帮忙。`,archetype:`A`,dimension_scores:{emotional_warmth:3,security_base:1}},B:{text:`尽量不求人，求人前要做好充分的准备和理由，不能让人觉得我不行。`,archetype:`B`,dimension_scores:{control_intensity:2,boundary_intrusion:1}},C:{text:`偶尔求助，但会精确计算分寸，不能让对方觉得我太麻烦或太依赖。`,archetype:`C`,dimension_scores:{conditional_love:2,emotional_warmth:1}},D:{text:`基本不会主动求助，觉得说了也没用，还是自己解决更靠谱。`,archetype:`D`,dimension_scores:{emotional_neglect:2,security_base:1}}}},{id:12,text:`面对自己的缺点时，你内心的声音更接近？`,options:{A:{text:`人都有不完美的地方，接受它，不影响我成为一个还不错的人。`,archetype:`A`,dimension_scores:{emotional_warmth:1,security_base:0}},B:{text:`你怎么总是不够好？再努力一点，别让别人发现你的短板。`,archetype:`B`,dimension_scores:{control_intensity:2,conditional_love:1}},C:{text:`只要别人不发现，这个缺点就等于不存在。`,archetype:`C`,dimension_scores:{conditional_love:2,boundary_intrusion:1}},D:{text:`我不太确定怎么样算好、怎么样算不好，标准一直在变。`,archetype:`D`,dimension_scores:{boundary_intrusion:2,emotional_neglect:2,conditional_love:2}}}},{id:13,text:`如果要离开一个待了很久的地方或状态，你的内心感受是？`,options:{A:{text:`有些不舍，但也期待新的开始，相信美好会延续下去。`,archetype:`A`,dimension_scores:{security_base:3,emotional_warmth:1}},B:{text:`如释重负终于自由了，但同时又有些不安，不确定自己能不能搞定。`,archetype:`B`,dimension_scores:{security_base:1,control_intensity:1}},C:{text:`告诉自己要理性，不要太多愁善感，往前走就对了。`,archetype:`C`,dimension_scores:{emotional_neglect:2,security_base:1}},D:{text:`反复确认自己是否做了正确的决定，担心一转身就回不去了。`,archetype:`D`,dimension_scores:{security_base:2,emotional_neglect:1}}}},{id:14,text:`关于心里话这件事，你更接近哪种状态？`,options:{A:{text:`想说就说，不想说也不觉得有压力，分享是自然的不是被迫的。`,archetype:`A`,dimension_scores:{boundary_intrusion:0,security_base:1,emotional_warmth:1}},B:{text:`不太敢说心里话，怕被抓住把柄或成为别人评判我的依据。`,archetype:`B`,dimension_scores:{boundary_intrusion:2,control_intensity:1}},C:{text:`会说一部分，但会筛选什么该说什么不该说，害怕说错话让人失望。`,archetype:`C`,dimension_scores:{boundary_intrusion:2,emotional_warmth:1}},D:{text:`不太确定什么该分享什么不该，从小就没有人真正问过我的想法。`,archetype:`D`,dimension_scores:{boundary_intrusion:3,emotional_neglect:1}}}},{id:15,text:`当别人获得了你也很想要的东西，你内心的第一反应是？`,options:{A:{text:`有点羡慕但不会嫉妒，别人值得，我继续努力也会有。`,archetype:`A`,dimension_scores:{emotional_warmth:1,security_base:1}},B:{text:`会提醒自己要更努力，必须做得更好才能被看见、被肯定。`,archetype:`B`,dimension_scores:{conditional_love:2,control_intensity:1}},C:{text:`告诉自己不要抱太大期待，期待越少失望就越小。`,archetype:`C`,dimension_scores:{emotional_neglect:1,conditional_love:1}},D:{text:`松一口气，被关注其实是压力，不被注意反而更轻松自由。`,archetype:`D`,dimension_scores:{emotional_neglect:1,conditional_love:1,boundary_intrusion:1}}}},{id:16,text:`你怎么看待生活中那些规矩？`,options:{A:{text:`大多数规则有它的道理，但必要时也可以灵活变通。`,archetype:`A`,dimension_scores:{security_base:2,control_intensity:0}},B:{text:`会尽量遵守，违反规则会让我感到不安和焦虑。`,archetype:`B`,dimension_scores:{control_intensity:2,security_base:1}},C:{text:`有些矛盾——有的规则值得遵守，有的只是别人用来约束我的工具。`,archetype:`C`,dimension_scores:{boundary_intrusion:2,security_base:1,control_intensity:1}},D:{text:`不太在意，因为我经历的规则总是在变，适应就好。`,archetype:`D`,dimension_scores:{emotional_neglect:2,security_base:2}}}},{id:17,text:`你是在什么时候意识到我长大了的？`,options:{A:{text:`发现自己也能保护和照顾别人了，那种感觉很自然很踏实。`,archetype:`A`,dimension_scores:{security_base:1,emotional_warmth:0}},B:{text:`发现自己终于能做那些一直被限制的事了，有一种带着快感的自由。`,archetype:`B`,dimension_scores:{control_intensity:1,emotional_neglect:1}},C:{text:`发现父母其实也不是万能的，他们也会犯错和脆弱。`,archetype:`C`,dimension_scores:{emotional_warmth:1,security_base:0}},D:{text:`发现早就习惯了独自面对一切，从来没人教过我怎么做，都是自己摸索。`,archetype:`D`,dimension_scores:{emotional_neglect:2,security_base:1}}}},{id:18,text:`听到别人真诚地夸奖你时，你通常会？`,options:{A:{text:`心里暖暖的，安心收下，觉得对方是真诚的。`,archetype:`A`,dimension_scores:{emotional_warmth:2,conditional_love:0}},B:{text:`有点不好意思，赶紧找理由证明自己没那么好，怕下次达不到期待。`,archetype:`B`,dimension_scores:{emotional_neglect:2,conditional_love:1}},C:{text:`心里有些警觉，在想对方是不是有什么目的或接下来要我做什么。`,archetype:`C`,dimension_scores:{conditional_love:2,boundary_intrusion:1}},D:{text:`有些恍惚，觉得对方夸的不是真正的我，而是我努力扮演的那个角色。`,archetype:`D`,dimension_scores:{emotional_neglect:2,conditional_love:2}}}},{id:19,text:`回顾自己现在的为人处世，你发现一个什么模式？`,options:{A:{text:`我不自觉地成了能给身边人温暖和支持的人，我喜欢这样的自
